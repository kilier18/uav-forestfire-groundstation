[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forestfire-gs"
version = "1.0.0"
description = "无人机森林防火监测地面站：AI 火情检测 + 单目火点定位 + 告警状态机 + PyQt5 指挥界面（毕业设计）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "uav-forestfire-groundstation contributors" }]
keywords = ["uav", "forest-fire", "ground-station", "yolov8", "pyqt5", "monocular-localization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.22", "PyQt5>=5.15"]

[project.optional-dependencies]
# 接入真实模型 / 真实视频流时才需要
vision = ["ultralytics>=8.2", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
forestfire-station = "forestfire_gs.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"